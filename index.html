<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3XyzMedia Viewer — Fixed Build</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #pano { width: 100vw; height: 100vh; display: block; }
        
        /* Панель управления */
        #ui-panel {
            position: absolute; top: 10px; right: 10px; width: 300px;
            background: rgba(10, 10, 15, 0.9); color: #fff;
            padding: 15px; border-radius: 8px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            z-index: 100;
        }
        h4 { margin: 0 0 10px 0; color: #aaa; font-size: 13px; text-transform: uppercase; }
        
        .slider-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #888; }
        input[type=range] { accent-color: #00d2ff; }
        .val-display { float: right; color: #00d2ff; font-weight: bold; }
        
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
        button {
            background: #222; border: 1px solid #444; color: #fff;
            padding: 6px 10px; border-radius: 4px; cursor: pointer;
            font-size: 12px; transition: 0.2s;
        }
        button:hover { background: #444; border-color: #666; }
        button.primary { background: #00d2ff; color: #000; font-weight: bold; }
        button.primary:hover { background: #00aacc; }

        /* Верхняя панель */
        #top-bar {
            position: absolute; top: 10px; left: 10px;
            display: flex; gap: 8px; z-index: 100;
        }
        .top-btn {
            background: rgba(255,255,255,0.1); color: white;
            padding: 8px 12px; border-radius: 6px; cursor: pointer;
        }
        .top-btn.active { background: #00d2ff; color: #000; }

        /* Подсказка внизу */
        #hints {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7); padding: 8px 12px;
            border-radius: 6px; color: #888; font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div id="top-bar">
        <div class="top-btn" id="btn-xyz">XYZ</div>
        <button class="top-btn primary" id="btn-play">▶ PLAY</button>
        <button class="top-btn" id="btn-home">🏠 HOME</button>
    </div>

    <!-- Область просмотра -->
    <div id="pano"></div>

    <!-- Панель настроек -->
    <div id="ui-panel">
        <div>
            <h4>Camera</h4>
            <div class="slider-group">
                <label>Distance <span id="v-dist" class="val-display">1.00</span></label>
                <input type="range" id="s-dist" min="0.01" max="1000" step="0.01" value="1">
            </div>
            <div class="slider-group">
                <label>Splat Size <span id="v-splat" class="val-display">0.25</span></label>
                <input type="range" id="s-splat" min="0.01" max="10" step="0.01" value="0.25">
            </div>
            <div class="slider-group">
                <label>Screen Min <span id="v-screen" class="val-display">0.30</span></label>
                <input type="range" id="s-screen" min="0.01" max="10" step="0.01" value="0.3">
            </div>
        </div>

        <div>
            <h4>Animation</h4>
            <div class="slider-group">
                <label>Speed <span id="v-speed" class="val-display">3.0</span>°/s</label>
                <input type="range" id="s-speed" min="0.1" max="360" step="0.1" value="3">
            </div>
            <div class="btn-row">
                <button id="btn-axis">XYZ: ON</button>
            </div>
        </div>

        <button class="primary" style="width: 100%;">SORT: DISTANCE</button>
    </div>

    <div id="hints">
        ЛКМ — вращать · ПКМ — двигать · Колесо — зум<br>
        PLAY — авто-вращение · HOME — сброс
    </div>

    <!-- Подключаем движок -->
    <script src="krpano.js"></script>
    
    <script>
        // --- ИНИЦИАЛИЗАЦИЯ ---
        let kr = null;
        let isPlaying = false;
        let animFrame = null;

        // Запускаем krpano
        krpano({
            target: 'pano',
            xml: 'scene.xml', // Убедись, что этот файл лежит рядом!
            onready: function(instance) {
                kr = instance;
                console.log('✅ Krpano loaded successfully');
                setupControls();
            },
            onerror: function(msg) {
                console.error('❌ Krpano Error:', msg);
                alert('Ошибка загрузки сцены. Проверь, лежит ли scene.xml рядом с index.html');
            }
        });

        // --- НАСТРОЙКА КОНТРОЛОВ ---
        function setupControls() {
            // Ползунки
            bindSlider('s-dist', 'v-dist', (val) => { if(kr) kr.set('view.tx', val * 100); }); // Пример маппинга
            bindSlider('s-splat', 'v-splat', (val) => { if(kr) kr.set('splats.scale', val); });
            bindSlider('s-screen', 'v-screen', (val) => { if(kr) kr.set('splats.antialias', val); });
            
            // Кнопки
            document.getElementById('btn-play').addEventListener('click', togglePlay);
            document.getElementById('btn-home').addEventListener('click', () => {
                if(kr) kr.call('resetview()');
            });
            
            document.getElementById('btn-axis').addEventListener('click', (e) => {
                e.target.innerText = e.target.innerText.includes('ON') ? 'XYZ: OFF' : 'XYZ: ON';
            });
        }

        function bindSlider(id, valId, callback) {
            const s = document.getElementById(id);
            const v = document.getElementById(valId);
            s.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                v.innerText = val.toFixed(2).replace('.', ',');
                callback(val);
            });
        }

        // --- ЛОГИКА PLAY ---
        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btn-play');
            const speed = parseFloat(document.getElementById('s-speed').value);
            
            if (isPlaying) {
                btn.innerText = '⏸ PAUSE';
                btn.style.background = '#ff4757';
                animate();
            } else {
                btn.innerText = '▶ PLAY';
                btn.style.background = '#00d2ff';
                if(animFrame) cancelAnimationFrame(animFrame);
            }
        }

        function animate() {
            if (!isPlaying || !kr) return;
            const currentH = kr.get('view.hlookat');
            const newH = (currentH + parseFloat(document.getElementById('s-speed').value)) % 360;
            kr.set('view.hlookat', newH);
            animFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
