<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3XyzMedia Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #pano { width: 100vw; height: 100vh; display: block; }
        
        /* Простая панель */
        #controls {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; color: white;
            display: flex; flex-direction: column; gap: 10px;
        }
        button {
            padding: 10px; cursor: pointer; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px;
        }
        button:hover { background: #555; }
        button.play-btn { background: #00d2ff; color: black; font-weight: bold; }
        button.play-btn.paused { background: #ff4757; }

        /* Подсказки */
        #hints {
            position: absolute; bottom: 10px; left: 10px;
            color: #555; background: rgba(255,255,255,0.1);
            padding: 5px 10px; border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="pano"></div>

    <div id="controls">
        <h3>Управление</h3>
        <button id="btn-play" class="play-btn">▶ PLAY</button>
        <button id="btn-home">🏠 HOME (Сброс)</button>
        <button id="btn-axis">XYZ: ON</button>
    </div>

    <div id="hints">
        ЛКМ — вращать · ПКМ — двигать · Колесо — зум
    </div>

    <!-- Подключаем движок -->
    <script src="krpano.js"></script>
    
    <script>
        let kr = null;
        let isPlaying = false;
        let animFrame = null;

        // Инициализация
        krpano({
            target: 'pano',
            xml: 'scene.xml', // Проверь, что этот файл есть в папке!
            onready: function(instance) {
                kr = instance;
                console.log('✅ Движок загружен, сцена готова');
            },
            onerror: function(msg) {
                console.error('❌ Ошибка загрузки:', msg);
                alert('Ошибка: не удалось загрузить scene.xml или krpano.js. Проверь файлы.');
            }
        });

        // Логика кнопок
        document.getElementById('btn-play').addEventListener('click', () => {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btn-play');
            
            if (isPlaying) {
                btn.innerText = '⏸ PAUSE';
                btn.classList.add('paused');
                animate();
            } else {
                btn.innerText = '▶ PLAY';
                btn.classList.remove('paused');
                if (animFrame) cancelAnimationFrame(animFrame);
            }
        });

        document.getElementById('btn-home').addEventListener('click', () => {
            if (kr) kr.call('resetview()');
        });

        document.getElementById('btn-axis').addEventListener('click', (e) => {
            e.target.innerText = e.target.innerText.includes('ON') ? 'XYZ: OFF' : 'XYZ: ON';
        });

        // Авто-вращение
        function animate() {
            if (!isPlaying || !kr) return;
            
            const speed = 2.0; // Скорость вращения
            const currentH = kr.get('view.hlookat');
            const newH = (currentH + speed) % 360;
            
            kr.set('view.hlookat', newH);
            animFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
